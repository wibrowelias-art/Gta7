<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0710" />
    <meta name="description" content="NEON CITY: an open-world driving mini game in a rain-slick neon city. Deliver, race and cruise." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>NEON CITY</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0710; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" role="region" aria-label="Game HUD"></div>
    <div id="intro">
      <h1>NEON CITY</h1>
      <p>A rain-slick open city at night. Walk to the car, get in, and take jobs across town: deliveries, taxi runs and street races.</p>
      <div class="loading-bar" id="loading"><i></i></div>
      <button class="btn primary hidden" id="play">Start driving</button>
      <p class="tiny">WASD or arrows · Space to drift · E to enter the car · touch controls on phones</p>
      <p class="tiny">Also in this repo: <a href="/hq.html">NEON HQ</a>, the tower management game.</p>
    </div>
    <script type="module" src="/src/city/main.ts"></script>
  </body>
</html>
